[workspace]
authors = ["sgirtsou <girtsou.s@gmail.com>"]
channels = ["conda-forge"]
name = "extreme"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "==3.11"
gdal = ">=3.10.3,<4"
proj = ">=9.7.1,<10"
bs4 = ">=4.14.3,<5"
lxml = ">=6.0.2,<7"
geopandas = ">=1.1.2,<2"
pyproj = ">=3.7.2,<4"
proj-data = ">=1.24,<2"
pip = ">=25.3,<26"
nbformat = ">=5.10.4,<6"
plotly = ">=6.5.2,<7"

[pypi-dependencies]
autoroot = ">=1.0.1, <2"
torch = ">=2.9.1, <3"
torchvision = ">=0.24.1, <0.25"
pytorch-lightning = ">=2.6.1, <3"
torchmetrics = ">=1.8.2, <2"
netcdf4 = ">=1.6.2,<2"
tqdm = ">=4.67.1,<5"
matplotlib = ">=3.9.1,<4"
tifffile = ">=2022.10.10,<2023"
h5py = ">=3.8.0,<4"
h5netcdf = ">=1.6.4,<2"
eumdac = ">=3.0.0,<4"
scikit-learn = ">=1.7.2,<2"
rioxarray = ">=0.18.1,<0.19"
ipykernel = ">=7.1.0,<8"
fsspec = ">=2025.9.0,<2026"
numcodecs = ">=0.16.1,<0.17"
zarr = ">=3.1.3,<4"
dask = ">=2024.8.1,<2025"
satpy = ">=0.58.0,<0.59"
xarray-datatree = ">=0.0.14,<0.0.15"
loguru = ">=0.7.3,<0.8"
rasterio = ">=1.4.3,<2"
cartopy = ">=0.25.0,<0.26"
pygrib = ">=2.1.6,<3"
gcsfs = ">=2025.9.0,<2026"
hydra-core = ">=1.3.2,<2"
omegaconf = ">=2.3.0,<3"
wandb = ">=0.22.3,<0.23"
